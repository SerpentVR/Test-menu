name: Build libModMenu.so
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ImGui and Dobby
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui imgui
          git clone --depth 1 https://github.com/jmpews/Dobby dobby_src
      - name: Patch Dobby for Android
        run: |
          F=dobby_src/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          sed -i -E 's/([A-Za-z0-9_]+)@PAGEOFF/:lo12:\1/g; s/@PAGE//g' $F
          grep -n "adrp\|lo12" $F || true
      - name: Build (arm64-v8a)
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 --target ModMenu -j4
      - uses: actions/upload-artifact@v4
        with:
          name: libModMenu
          path: build-arm64/libModMenu.so
